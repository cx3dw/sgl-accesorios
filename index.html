<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SGL ACCESORIOS | Tienda Mobile-First PWA</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Phosphor Icons for Native Mobile Feel -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            },
            accent: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          },
          boxShadow: {
            'mobile-bottom': '0 -4px 20px -2px rgba(0, 0, 0, 0.1)',
            'floating': '0 10px 25px -5px rgba(0, 0, 0, 0.2)'
          }
        }
      }
    }
  </script>

  <style>
    /* Mobile-first touch tap targets & smooth scrolling */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text;
    }
    /* Hide scrollbars for clean app look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Native feel overscroll behavior */
    body {
      overscroll-behavior-y: contain;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Safe area padding for modern notch devices */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 12px);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 h-full flex flex-col transition-colors duration-200">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 pt-safe transition-all">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      
      <!-- Brand Logo & Mobile Toggle -->
      <div class="flex items-center gap-2">
        <button onclick="openFilterDrawer()" class="md:hidden p-2 -ml-2 text-gray-600 dark:text-gray-300 active:scale-95 transition-transform" aria-label="Abrir Filtros">
          <i class="ph ph-sliders-horizontal text-2xl"></i>
        </button>
        <div class="flex items-center gap-1.5 cursor-pointer" onclick="resetAppView()">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md font-extrabold text-xl">
            S
          </div>
          <div>
            <h1 class="text-base font-extrabold tracking-tight leading-tight text-gray-900 dark:text-white">
              SGL <span class="text-brand-600 dark:text-brand-500">ACCESORIOS</span>
            </h1>
            <p class="text-[10px] text-gray-500 dark:text-gray-400 -mt-1 font-medium">Mayorista & Minorista</p>
          </div>
        </div>
      </div>

      <!-- Quick Search Input -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar por código, nombre..." 
            class="w-full bg-gray-100 dark:bg-gray-800 border-none rounded-full pl-9 pr-8 py-2 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-gray-100 placeholder-gray-400 transition-all"
            oninput="handleSearch(this.value)"
          />
          <button id="btn-clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
            <i class="ph ph-x-circle-fill text-lg"></i>
          </button>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Modo Oscuro/Claro">
          <i id="theme-icon" class="ph ph-moon text-xl"></i>
        </button>

        <button onclick="openAdminModal()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Panel Admin">
          <i class="ph ph-gear text-xl"></i>
        </button>

        <!-- Desktop Cart Trigger -->
        <button onclick="openCartDrawer()" class="hidden md:flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-full font-medium text-sm transition-transform active:scale-95 shadow-md">
          <i class="ph ph-shopping-bag-open text-lg"></i>
          <span>Carrito</span>
          <span id="header-cart-badge" class="bg-white text-brand-700 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>

    </div>

    <!-- Quick Category Pill Scrollbar -->
    <div class="px-4 py-2 border-t border-gray-100 dark:border-gray-800/80 overflow-x-auto no-scrollbar flex items-center gap-2 text-xs font-medium">
      <button onclick="filterByCategory('all')" id="pill-cat-all" class="cat-pill active-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-brand-600 text-white transition-all shadow-sm">
        Todos
      </button>
      <button onclick="filterByCategory('Cargadores')" id="pill-cat-Cargadores" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
        ⚡ Cargadores
