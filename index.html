<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SGL ACCESORIOS | Tienda Online</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- CREDENCIALES DE SUPABASE INTEGRADAS -->
  <script>
    const SUPABASE_URL = 'https://qxinfbodipqinyvgeojz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Xw82gmg4CLS8WHLAZtYI7Q_mLL2GQqj';
    
    // Se guarda la cliente en 'db' para evitar conflictos de nombres
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <!-- CABECERA PRINCIPAL -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      
      <!-- Logo y Título -->
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-black text-xl shadow-md">
          S
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight leading-none text-gray-900 dark:text-white">
            SGL <span class="text-brand-600">ACCESORIOS</span>
          </h1>
          <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium">Mayorista & Minorista</p>
        </div>
      </div>

      <!-- Buscador -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Buscar producto o código..." 
            class="w-full bg-gray-100 dark:bg-gray-800 border-none rounded-full pl-9 pr-4 py-2 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 outline-none text-gray-900 dark:text-gray-100 placeholder-gray-400"
            oninput="buscarProductos(this.value)"
          />
        </div>
      </div>

      <!-- Acciones de Cabecera -->
      <div class="flex items-center gap-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800">
          <i id="theme-icon" class="ph ph-moon text-xl"></i>
        </button>

        <button onclick="abrirModalNuevoProducto()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
          <i class="ph ph-plus-circle text-base"></i>
          <span class="hidden sm:inline">Agregar</span>
        </button>
      </div>

    </div>

    <!-- Barra de Categorías -->
    <div class="px-4 py-2 border-t border-gray-100 dark:border-gray-800/80 overflow-x-auto no-scrollbar flex items-center gap-2 text-xs font-medium">
      <button onclick="filtrarCategoria('all')" class="cat-pill active-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-brand-600 text-white transition-all shadow-sm">
        Todos
      </button>
      <button onclick="filtrarCategoria('Cargadores')" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
        ⚡ Cargadores
      </button>
      <button onclick="filtrarCategoria('Fundas')" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
        📱 Fundas
      </button>
      <button onclick="filtrarCategoria('Auriculares')" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
        🎧 Auriculares
      </button>
      <button onclick="filtrarCategoria('Cables')" class="cat-pill whitespace-nowrap px-3.5 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
        🔌 Cables
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    
    <!-- Loader -->
    <div id="loading" class="text-center py-16">
      <i class="ph ph-spinner animate-spin text-4xl text-brand-600"></i>
      <p class="text-sm text-gray-500 mt-2 font-medium">Conectando con Supabase...</p>
    </div>

    <!-- Rejilla de Productos -->
    <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden">
      <!-- Se genera dinámicamente con JavaScript -->
    </div>

  </main>

  <!-- MODAL: AGREGAR NUEVO PRODUCTO -->
  <div id="modal-producto" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold">Agregar Producto</h3>
        <button onclick="cerrarModalNuevoProducto()" class="text-gray-400 hover:text-gray-600">
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>
      
      <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Código</label>
          <input type="text" id="p-codigo" required class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="EJ: CAR-01">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Nombre del Producto</label>
          <input type="text" id="p-nombre" required class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="Cargador Carga Rápida 20W">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Categoría</label>
            <input type="text" id="p-categoria" class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="Cargadores">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Marca</label>
            <input type="text" id="p-marca" class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="Samsung">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Precio ($)</label>
            <input type="number" step="0.01" id="p-precio" required class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="15.00">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">Stock</label>
            <input type="number" id="p-stock" required class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="50">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 dark:text-gray-300">URL de la Imagen (Opcional)</label>
          <input type="url" id="p-imagen" class="w-full border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-brand-500" placeholder="https://...">
        </div>

        <div class="flex justify-end gap-2 mt-5">
          <button type="button" onclick="cerrarModalNuevoProducto()" class="px-4 py-2 rounded-lg text-xs font-medium bg-gray-200 dark:bg-gray-700">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-lg text-xs font-semibold bg-brand-600 text-white shadow hover:bg-brand-700">Guardar en Supabase</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT CON TODA LA LÓGICA DE FUNCIONAMIENTO -->
  <script>
    let productosLocales = [];

    // 1. Cargar productos desde Supabase usando 'db'
    async function obtenerProductos() {
      mostrarLoader(true);
      try {
        const { data, error } = await db
          .from('productos')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        productosLocales = data || [];
        renderizarProductos(productosLocales);
      } catch (err) {
        console.error('Error cargando datos:', err.message);
        alert('Error al conectar con Supabase: ' + err.message);
      } finally {
        mostrarLoader(false);
      }
    }

    // 2. Renderizar lista de productos
    function renderizarProductos(lista) {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';

      if (lista.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="ph ph-package text-4xl mb-2"></i>
            <p class="text-sm font-medium">No hay productos guardados.</p>
            <p class="text-xs text-gray-500 mt-1">Presiona "Agregar" arriba para registrar el primero.</p>
          </div>`;
        return;
      }

      lista.forEach(p => {
        const imagenUrl = p.imagen || 'https://via.placeholder.com/300x300?text=SGL+Accesorios';
        
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 rounded-2xl p-3 border border-gray-100 dark:border-gray-700/60 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow';
        
        card.innerHTML = `
          <div>
            <div class="relative w-full h-32 mb-2 overflow-hidden rounded-xl bg-gray-100 dark:bg-gray-900">
              <img src="${imagenUrl}" alt="${p.nombre}" class="w-full h-full object-cover">
            </div>
            <span class="text-[9px] font-bold text-brand-600 dark:text-brand-500 uppercase tracking-wider">${p.categoria || 'General'}</span>
            <h4 class="text-xs font-bold leading-snug line-clamp-2 text-gray-800 dark:text-gray-100">${p.nombre}</h4>
            <p class="text-[10px] text-gray-400 mt-0.5">Cód: ${p.codigo}</p>
          </div>
          <div class="mt-3 pt-2 border-t border-gray-100 dark:border-gray-700/80 flex items-center justify-between">
            <div>
              <span class="text-sm font-extrabold text-gray-900 dark:text-white">$${Number(p.precio).toFixed(2)}</span>
              <span class="block text-[9px] text-gray-400">Stock: ${p.stock}</span>
            </div>
            <button onclick="eliminarProducto(${p.id})" class="text-red-500 hover:text-red-700 p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors" title="Eliminar">
              <i class="ph ph-trash text-base"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 3. Guardar producto en Supabase usando 'db'
    async function guardarProducto(e) {
      e.preventDefault();

      const nuevoProducto = {
        codigo: document.getElementById('p-codigo').value.trim(),
        nombre: document.getElementById('p-nombre').value.trim(),
        categoria: document.getElementById('p-categoria').value.trim() || 'General',
        marca: document.getElementById('p-marca').value.trim() || 'SGL',
        precio: parseFloat(document.getElementById('p-precio').value),
        stock: parseInt(document.getElementById('p-stock').value),
        imagen: document.getElementById('p-imagen').value.trim() || null
      };

      mostrarLoader(true);

      try {
        const { error } = await db
          .from('productos')
          .insert([nuevoProducto]);

        if (error) throw error;

        cerrarModalNuevoProducto();
        document.getElementById('form-producto').reset();
        await obtenerProductos();
      } catch (err) {
        alert('Error al guardar en Supabase: ' + err.message);
      } finally {
        mostrarLoader(false);
      }
    }

    // 4. Eliminar producto de Supabase usando 'db'
    async function eliminarProducto(id) {
      if (!confirm('¿Seguro que deseas borrar este producto de la nube?')) return;

      mostrarLoader(true);
      try {
        const { error } = await db
          .from('productos')
          .delete()
          .eq('id', id);

        if (error) throw error;

        await obtenerProductos();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      } finally {
        mostrarLoader(false);
      }
    }

    // 5. Búsqueda y Filtros
    function buscarProductos(texto) {
      const q = texto.toLowerCase();
      const filtrados = productosLocales.filter(p => 
        p.nombre.toLowerCase().includes(q) || 
        p.codigo.toLowerCase().includes(q)
      );
      renderizarProductos(filtrados);
    }

    function filtrarCategoria(cat) {
      if (cat === 'all') {
        renderizarProductos(productosLocales);
      } else {
        const filtrados = productosLocales.filter(p => p.categoria && p.categoria.toLowerCase() === cat.toLowerCase());
        renderizarProductos(filtrados);
      }
    }

    // Auxiliares de Interfaz
    function mostrarLoader(show) {
      const loader = document.getElementById('loading');
      const grid = document.getElementById('grid-productos');
      if (show) {
        loader.classList.remove('hidden');
        grid.classList.add('hidden');
      } else {
        loader.classList.add('hidden');
        grid.classList.remove('hidden');
      }
    }

    function abrirModalNuevoProducto() {
      document.getElementById('modal-producto').classList.remove('hidden');
    }

    function cerrarModalNuevoProducto() {
      document.getElementById('modal-producto').classList.add('hidden');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // Inicializar al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      obtenerProductos();
    });
  </script>
</body>
</html>
