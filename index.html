<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SGL ACCESORIOS | Tienda Online</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-full flex flex-col">

  <script>
    const SUPABASE_URL = 'https://qxinfbodipqinyvgeojz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Xw82gmg4CLS8WHLAZtYI7Q_mLL2GQqj';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const TELEFONO_WHATSAPP = '59894586969';
  </script>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-emerald-400 flex items-center justify-center text-white font-black text-xl shadow-md">
          S
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight leading-none text-gray-900 dark:text-white">
            SGL <span class="text-emerald-600">ACCESORIOS</span>
          </h1>
          <p class="text-[10px] text-gray-500 font-medium">Tienda Online</p>
        </div>
      </div>

      <div class="flex-1 max-w-md mx-2 flex items-center gap-2">
        <input 
          type="text" 
          placeholder="Buscar producto..." 
          class="w-full bg-gray-100 dark:bg-gray-800 border-none rounded-full pl-4 pr-4 py-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
          oninput="buscarProductos(this.value)"
        />
        
        <!-- Botón para compartir la web completa -->
        <button 
          onclick="compartirWeb()" 
          class="bg-emerald-50 hover:bg-emerald-100 dark:bg-gray-800 dark:hover:bg-gray-700 text-emerald-600 dark:text-emerald-400 p-2 rounded-full transition-colors flex items-center justify-center flex-shrink-0"
          title="Compartir tienda"
        >
          <i class="ph ph-share-network text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- CATÁLOGO DE PRODUCTOS -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
    <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <!-- Carga dinámica -->
    </div>
  </main>

  <!-- NOTIFICACIÓN TOAST -->
  <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-lg transition-all transform translate-y-20 opacity-0 z-50 flex items-center gap-2">
    <i class="ph ph-check-circle text-emerald-400 text-lg"></i>
    <span id="toast-message">¡Enlace copiado!</span>
  </div>

  <script>
    let productosLocales = [];

    async function obtenerProductos() {
      const { data } = await db.from('productos').select('*').order('id', { ascending: false });
      productosLocales = data || [];
      renderizarProductos(productosLocales);
    }

    function renderizarProductos(lista) {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';
      
      if (lista.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center py-10 text-gray-400 text-sm">No hay productos disponibles.</p>`;
        return;
      }

      lista.forEach(p => {
        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-gray-800 rounded-2xl p-3 border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col justify-between relative group';
        
        card.innerHTML = `
          <div>
            <div class="relative w-full h-32 mb-2 overflow-hidden rounded-xl bg-gray-100">
              <img src="${p.imagen || ''}" class="w-full h-full object-cover">
              
              <!-- Botón Compartir Producto -->
              <button onclick="compartirProducto('${p.nombre.replace(/'/g, "\\'")}', '${p.codigo}')" class="absolute top-2 right-2 bg-white/90 dark:bg-gray-900/90 hover:bg-white text-gray-700 dark:text-gray-200 p-2 rounded-full shadow-md backdrop-blur transition-all active:scale-95" title="Compartir producto">
                <i class="ph ph-share-network text-base"></i>
              </button>
            </div>

            <h4 class="text-xs font-bold line-clamp-2 text-gray-800 dark:text-gray-100">${p.nombre}</h4>
            <p class="text-[10px] text-gray-400">Cód: ${p.codigo}</p>
          </div>

          <div class="mt-3 pt-2 border-t border-gray-100 dark:border-gray-700/50 flex items-center justify-between">
            <span class="text-sm font-extrabold text-gray-900 dark:text-white">$${Number(p.precio).toFixed(2)}</span>
            
            <!-- Botón Consultar por WhatsApp -->
            <a href="https://wa.me/${TELEFONO_WHATSAPP}?text=Hola, consulto por el producto: ${encodeURIComponent(p.nombre)} (Cód: ${p.codigo})" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition-colors flex items-center gap-1.5" title="Consultar por WhatsApp">
              <i class="ph ph-whatsapp-logo text-base"></i> Consultar
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function buscarProductos(texto) {
      const q = texto.toLowerCase();
      const filtrados = productosLocales.filter(p => p.nombre.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q));
      renderizarProductos(filtrados);
    }

    // Compartir Web (Con Try/Catch para evitar bloqueos del navegador)
    async function compartirWeb() {
      const urlActual = window.location.href;
      
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'SGL ACCESORIOS',
            url: urlActual
          });
          return;
        } catch (err) {
          // Si el usuario cancela o el navegador falla, pasa al método alternativo
        }
      }

      copiarAlPortapapeles(urlActual, "¡Enlace de la tienda copiado!");
    }

    // Compartir Producto
    async function compartirProducto(nombre, codigo) {
      const urlActual = window.location.href;
      const textoCompartir = `Mirá este producto en SGL Accesorios: ${nombre} (Cód: ${codigo})\n${urlActual}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: nombre,
            text: `SGL Accesorios: ${nombre}`,
            url: urlActual
          });
          return;
        } catch (err) {
          // Si falla abre portapapeles
        }
      }

      copiarAlPortapapeles(textoCompartir, "¡Enlace del producto copiado!");
    }

    function copiarAlPortapapeles(texto, mensajeExito) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(() => {
          mostrarToast(mensajeExito);
        }).catch(() => {
          copiarTradicional(texto, mensajeExito);
        });
      } else {
        copiarTradicional(texto, mensajeExito);
      }
    }

    function copiarTradicional(texto, mensajeExito) {
      const input = document.createElement('input');
      input.value = texto;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      mostrarToast(mensajeExito);
    }

    function mostrarToast(mensaje) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = mensaje;
      toast.classList.remove('translate-y-20', 'opacity-0');
      
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    window.addEventListener('DOMContentLoaded', obtenerProductos);
  </script>
</body>
</html>
